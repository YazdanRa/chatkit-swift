name: ChatKitSwiftDemo
options:
  bundleIdPrefix: com.chatkitswift
  deploymentTarget:
    iOS: "18.0"
packages:
  ChatKitSwift:
    path: ../..
targets:
  ChatKitSwiftDemo:
    type: application
    platform: iOS
    sources:
      - path: ChatKitSwiftDemo
    dependencies:
      - package: ChatKitSwift
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatKitSwiftDemo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.chatkitswift.demo
        SWIFT_VERSION: 6.0
    preBuildScripts:
      - name: Copy Local Env
        inputFiles:
          - $(PROJECT_DIR)/.env
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/.env
        script: |
          set -euo pipefail

          env_file="${PROJECT_DIR}/.env"
          resources_dir="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          bundled_env="${resources_dir}/.env"

          mkdir -p "${resources_dir}"
          rm -f "${bundled_env}"

          if [ -f "${env_file}" ]; then
            cp "${env_file}" "${bundled_env}"
          fi
